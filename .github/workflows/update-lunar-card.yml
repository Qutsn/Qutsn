name: Update lunar status

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunar-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test lunar model
        run: node --test tests/lunar-card.test.mjs

      - name: Generate today's card
        run: node scripts/generate-lunar-card.mjs

      - name: Commit changed status
        shell: bash
        run: |
          if git diff --quiet -- assets/lunar-status.svg; then
            echo "Lunar status is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lunar-status.svg
          git commit -m "chore: update lunar status [skip ci]"
          git push
